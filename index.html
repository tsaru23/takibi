<style>
  :root { --fg:#f3d9b8; --dim:#b89873; --panel:rgba(24,15,9,.72); --line:rgba(255,190,120,.18); --accent:#ff9a3c; }

    font-family:system-ui,-apple-system,"Segoe UI","Hiragino Sans","Yu Gothic UI","Meiryo",sans-serif; }
  canvas { position:fixed; inset:0; width:100%; height:100%; display:block; cursor:pointer; }
  body.video-off canvas { display:none; }
  #cv3 { touch-action:none; }
  #noVideo { position:fixed; inset:0; display:none; align-items:center; justify-content:center; text-align:center; padding:24px; color:var(--dim); font-size:15px; line-height:1.8; pointer-events:none; }
  body.no-webgl #noVideo { display:flex; }
  body.no-webgl.video-off #noVideo { display:none; }
  select { width:100%; padding:7px 8px; border-radius:8px; border:1px solid var(--line); background:rgba(40,24,14,.9); color:var(--fg); font:inherit; }
  #toast { position:fixed; top:14px; left:50%; transform:translateX(-50%); padding:6px 14px; border-radius:999px; border:1px solid var(--line);
    background:var(--panel); color:var(--dim); font-size:12px; opacity:0; transition:opacity .5s; pointer-events:none; z-index:5; }
  #toast.on { opacity:1; }
  .seg button:disabled { opacity:.35; cursor:not-allowed; }
  .ui { transition:opacity .6s; }
  body.idle:not(.panel-open) .ui { opacity:0; pointer-events:none; }
  body.idle:not(.panel-open) canvas { cursor:none; }
  #fuel { position:fixed; left:16px; bottom:16px; font-size:12px; color:var(--dim); display:flex; align-items:center; gap:8px; user-select:none; }
  #dots { display:flex; gap:4px; }
  #dots i { width:14px; height:5px; border-radius:2px; background:var(--accent); opacity:.15; display:block; }
  #feed { position:fixed; left:50%; bottom:18px; transform:translateX(-50%); padding:10px 22px; border-radius:999px;
    border:1px solid var(--line); background:var(--panel); color:var(--fg); font:inherit; font-size:14px; cursor:pointer; backdrop-filter:blur(6px); }
  #feed:hover { border-color:rgba(255,190,120,.5); }
  #gear { position:fixed; right:14px; bottom:14px; width:42px; height:42px; border-radius:50%; border:1px solid var(--line);
    background:var(--panel); color:var(--fg); font-size:20px; cursor:pointer; backdrop-filter:blur(6px); line-height:1; }
  #panel { position:fixed; right:14px; bottom:64px; width:min(300px,calc(100vw - 28px)); max-height:calc(100vh - 90px); overflow:auto;
    padding:14px 16px; border-radius:14px; border:1px solid var(--line); background:var(--panel); backdrop-filter:blur(8px);
    font-size:13px; display:none; }
  body.panel-open #panel { display:block; }
  .row { margin:10px 0; }
  .row label { display:flex; justify-content:space-between; color:var(--dim); margin-bottom:4px; }
  .row output { color:var(--fg); font-variant-numeric:tabular-nums; }
  input[type=range] { width:100%; accent-color:var(--accent); margin:0; }
  .chk { display:flex; align-items:center; gap:8px; margin:10px 0; cursor:pointer; color:var(--fg); }
  .chk input { accent-color:var(--accent); width:16px; height:16px; }
  #panel h2 { margin:0 0 4px; font-size:13px; font-weight:600; color:var(--dim); letter-spacing:.1em; }
  #panel .hint { font-size:11px; color:var(--dim); margin-top:10px; line-height:1.5; }
  #start { position:fixed; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:14px;
    background:rgba(6,4,2,.55); z-index:10; text-align:center; padding:20px; }
  #start button { padding:16px 40px; font-size:20px; border-radius:999px; border:1px solid rgba(255,190,120,.5);
    background:rgba(60,32,14,.8); color:var(--fg); cursor:pointer; font-family:inherit; letter-spacing:.15em; }
  #start button:hover { background:rgba(90,46,18,.9); }
  #start p { margin:0; color:var(--dim); font-size:13px; line-height:1.7; }
  body.started #start { display:none; }
  #panel h2 { margin:16px 0 4px; padding-top:10px; border-top:1px solid var(--line); }
  #panel h2:first-of-type { margin-top:12px; }
  .seg { display:flex; border:1px solid var(--line); border-radius:8px; overflow:hidden; margin-bottom:4px; }
  .seg button { flex:1; padding:7px 0; background:transparent; border:0; color:var(--dim); cursor:pointer; font:inherit; }
  .seg button.on { background:rgba(255,154,60,.25); color:var(--fg); }
  .ehead { display:flex; align-items:center; gap:8px; color:var(--fg); margin-bottom:4px; }
  .ehead span { flex:1; }
  .ehead output { color:var(--dim); font-variant-numeric:tabular-nums; }
  .ehead input { accent-color:var(--accent); width:16px; height:16px; margin:0; }
  .note { font-size:11px; color:var(--dim); margin:2px 0 0 24px; }
  .row.off { opacity:.4; }
  .ic { display:inline-flex; vertical-align:-3px; }
  .ic svg { width:1.15em; height:1.15em; stroke:currentColor; stroke-width:2; fill:none; stroke-linecap:round; stroke-linejoin:round; }

  .seg button { display:flex; align-items:center; justify-content:center; }

<body>
<div id="noVideo" role="status">このブラウザでは映像を表示できません。音だけで使えます</div>

<div id="start">
  <button id="ignite">火をつける</button>
  <p>音が出ます。クリックで薪をくべられます。<br>右下の歯車で調整できます。</p>
</div>

<div id="toast" role="status"></div>
<div id="fuel" class="ui"><span>薪</span><span id="dots"></span><span id="fuelTxt"></span></div>
<button id="feed" class="ui" type="button"><span class="ic" data-icon="flame"></span>薪をくべる</button>
<button id="gear" class="ui" type="button" aria-label="設定"><span class="ic" data-icon="settings"></span></button>
<div id="panel" class="ui">
  <div class="row" id="sceneRow" style="display:none"><label><span>シーン</span></label><select id="sceneSel"></select></div>
  <div class="seg" id="seasonSeg"></div>
  <label class="chk"><input type="checkbox" id="seasonFx"> 季節の演出</label>
  <label class="chk"><input type="checkbox" id="fireflies"> ホタル</label>
  <label class="chk"><input type="checkbox" id="nightSky"> 夜空（星・月・流れ星）</label>
  <h2>焚火</h2>
  <div class="row" id="grassRow"><label><span>草の量</span></label><div class="seg" id="grassSeg"></div></div>
  <div id="sliders"></div>
  <label class="chk"><input type="checkbox" id="autoFeed"> 自動くべ（薪が減ったら足す）</label>
  <label class="chk"><input type="checkbox" id="videoOff"> <span class="ic" data-icon="eye-off"></span>映像オフ（音だけ）</label>
  <h2>環境音</h2>
  <div id="envAll"></div>
  <h2 id="seasonH">季節の音</h2>
  <div id="envSeason"></div>
  <div class="hint">クリック / スペースキーで薪をくべる。Hキーで操作UIを隠す。ドラッグで視点を少し回せます。</div>
</div>

<script>
(function () {
'use strict';

/* Lucide icons (ISC License, https://lucide.dev) — inline, 24x24 stroke icons */
var ICONS = {

  'flame': '<path d="M12 3q1 4 4 6.5t3 5.5a1 1 0 0 1-14 0 5 5 0 0 1 1-3 1 1 0 0 0 5 0c0-2-1.5-3-1.5-5q0-2 2.5-4"/>',
  'eye-off': '<path d="M10.733 5.076a10.744 10.744 0 0 1 11.205 6.575 1 1 0 0 1 0 .696 10.747 10.747 0 0 1-1.444 2.49"/><path d="M14.084 14.158a3 3 0 0 1-4.242-4.242"/><path d="M17.479 17.499a10.75 10.75 0 0 1-15.417-5.151 1 1 0 0 1 0-.696 10.75 10.75 0 0 1 4.446-5.143"/><path d="m2 2 20 20"/>',
  'volume-2': '<path d="M11 4.702a.705.705 0 0 0-1.203-.498L6.413 7.587A1.4 1.4 0 0 1 5.416 8H3a1 1 0 0 0-1 1v6a1 1 0 0 0 1 1h2.416a1.4 1.4 0 0 1 .997.413l3.383 3.384A.705.705 0 0 0 11 19.298z"/><path d="M16 9a5 5 0 0 1 0 6"/><path d="M19.364 18.364a9 9 0 0 0 0-12.728"/>',

  'sun': '<circle cx="12" cy="12" r="4"/><path d="M12 2v2"/><path d="M12 20v2"/><path d="m4.93 4.93 1.41 1.41"/><path d="m17.66 17.66 1.41 1.41"/><path d="M2 12h2"/><path d="M20 12h2"/><path d="m6.34 17.66-1.41 1.41"/><path d="m19.07 4.93-1.41 1.41"/>',

  'snowflake': '<path d="m10 20-1.25-2.5L6 18"/><path d="M10 4 8.75 6.5 6 6"/><path d="m14 20 1.25-2.5L18 18"/><path d="m14 4 1.25 2.5L18 6"/><path d="m17 21-3-6h-4"/><path d="m17 3-3 6 1.5 3"/><path d="M2 12h6.5L10 9"/><path d="m20 10-1.5 2 1.5 2"/><path d="M22 12h-6.5L14 15"/><path d="m4 10 1.5 2L4 14"/><path d="m7 21 3-6-1.5-3"/><path d="m7 3 3 6h4"/>'
};
function iconSvg(name) {
  return '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">' + ICONS[name] + '</svg>';
}
Array.prototype.forEach.call(document.querySelectorAll('[data-icon]'), function (el) { el.innerHTML = iconSvg(el.getAttribute('data-icon')); });
var SEAS_ICON = { spring: 'flower-2', summer: 'sun', autumn: 'leaf', winter: 'snowflake' };

/* ---------- 設定 ---------- */
var DEFAULTS = { brightness:1, crackFreq:0.5, crackSize:0.5, roar:0.5, master:0.7, speed:1, autoFeed:true, videoOff:false, scene:'forest', nightSky:true, fireflies:false, firefliesManual:false, grass:'normal', grassAuto:'' };
var SLIDERS = [
  ['brightness','明るさ',0.3,1.6,0.01,function(v){return Math.round(v*100)+'%';}],
  ['crackFreq','パチパチの頻度',0,1,0.01,function(v){return Math.round(v*100)+'%';}],
  ['crackSize','パチパチの大きさ',0,1,0.01,function(v){return Math.round(v*100)+'%';}],
  ['roar','燃焼音（ゴー）の音量',0,1,0.01,function(v){return Math.round(v*100)+'%';}],
  ['master','全体音量',0,1,0.01,function(v){return Math.round(v*100)+'%';}],
  ['speed','燃える速さ',0.2,3,0.05,function(v){return '×'+v.toFixed(2);}]
];
var GRASS = ['many', 'normal', 'few', 'none'], GRASS_JA = { many: '多い', normal: 'ふつう', few: '少ない', none: 'なし' };
var SEASONS = ['spring', 'summer', 'autumn', 'winter'];
var SEAS_JA = { spring: '春', summer: '夏', autumn: '秋', winter: '冬' };
var ENV = [
  { id: 'wave', label: 'さざ波', scope: 'all' }, { id: 'insect', label: '虫の声', scope: 'all' },
  { id: 'rain', label: '雨', scope: 'all' }, { id: 'wind', label: '風', scope: 'all' },
  { id: 'brook', label: 'せせらぎ', scope: 'spring' },
  { id: 'chime', label: '風鈴', scope: 'summer' }, { id: 'fw', label: '遠くの花火', scope: 'summer' },
  { id: 'leaves', label: '落ち葉のカサカサ', scope: 'autumn' },
  { id: 'kettle', label: 'やかんのしゅんしゅん', scope: 'winter' },
  { id: 'snowq', label: '雪の静けさ（音がこもる）', scope: 'winter', noVol: true }
];
(function () {
  var m = new Date().getMonth() + 1;
  DEFAULTS.season = m >= 3 && m <= 5 ? 'spring' : m >= 6 && m <= 8 ? 'summer' : m >= 9 && m <= 11 ? 'autumn' : 'winter';
  DEFAULTS.seasonFx = true;
  ENV.forEach(function (e) { DEFAULTS['on_' + e.id] = false; DEFAULTS['vol_' + e.id] = 0.7; });
})();
var STORE_KEY = 'takibi.settings.v1';
var S = {};
(function load() {
  var k; for (k in DEFAULTS) S[k] = DEFAULTS[k];
  try {
    var raw = localStorage.getItem(STORE_KEY);
    if (raw) {
      var o = JSON.parse(raw);
      for (k in DEFAULTS) {
        if (typeof DEFAULTS[k] === 'number' && typeof o[k] === 'number' && isFinite(o[k])) S[k] = o[k];
        else if (typeof DEFAULTS[k] === 'boolean' && typeof o[k] === 'boolean') S[k] = o[k];
        else if (k === 'season' && SEASONS.indexOf(o[k]) >= 0) S[k] = o[k];
        else if (k === 'scene' && typeof o[k] === 'string' && /^[a-z0-9_-]{1,32}$/.test(o[k])) S[k] = o[k];
        else if (k === 'grass' && GRASS.indexOf(o[k]) >= 0) S[k] = o[k];
        else if (k === 'grassAuto' && (o[k] === '' || GRASS.indexOf(o[k]) >= 0)) S[k] = o[k];
      }
    }
  } catch (e) {}
})();
// シーンの音の連動で自動オンにした環境音は、保存しない（次回起動時に「元の状態」が分からなくなるため）
var autoApplied = [];
function save() {
  try {
    var c = {}, k; for (k in S) c[k] = S[k];
    autoApplied.forEach(function (id) { c['on_' + id] = false; });
    localStorage.setItem(STORE_KEY, JSON.stringify(c));
  } catch (e) {}
}
// ホタルは季節の初期値（夏だけオン）に従う。ユーザーが手で変えたら、その値を優先する
function firefliesOn() { return S.firefliesManual ? S.fireflies : S.season === 'summer'; }

/* ---------- 状態（燃料モデル） ---------- */
var MAX_FUEL = 8;
var started = false;
var fuel = 0;          // 薪の量。1本 = 1.0
var flame = 0;         // なめらかな炎の強さ 0..~1.3（音・映像の両方が参照）
var boost = 0;         // くべた直後の「パチパチ増」 1→0
var drops = [];        // 落下中の薪 {t0, landAt, dx, ang}
var lastFeedAt = 0;
var lastStep = performance.now();
var visible = !document.hidden;

function smooth(a, b, x) { x = Math.min(1, Math.max(0, (x - a) / (b - a))); return x * x * (3 - 2 * x); }
function rnd(a, b) { return a + Math.random() * (b - a); }
function gauss() { return (Math.random() + Math.random() + Math.random() - 1.5) / 1.5; }
var videoOK = false;   // 3D の映像が使える（WebGL が使え、scene3d.js の起動に成功した）
function drawingOn() { return !S.videoOff && visible && videoOK; }

function flameTarget() {
  var t = 1.2 * (1 - Math.exp(-fuel / 3));
  t *= smooth(0.03, 0.3, fuel);
  return t * (1 + 0.2 * boost);
}
function emberLevel() { return started ? 1 - smooth(0.02, 0.5, fuel) : 0; }

function addLog() {
  if (!started) return;
  if (fuel + drops.length >= MAX_FUEL - 0.01) return;
  var now = performance.now();
  if (drawingOn()) {
    var dr = { t0: now, landAt: now + 450, dx: rnd(-0.18, 0.18), ang: rnd(-0.6, 0.6) };

    emitLog({ type: 'drop', t0: dr.t0, landAt: dr.landAt, dx: dr.dx, ang: dr.ang });
  } else {
    land({ dx: 0 });
  }
  if (ac) playClack();

function land(d) {
  fuel = Math.min(MAX_FUEL, fuel + 1);
  flame *= 0.55;      // 一瞬弱まる
  boost = 1;          // その後 大きくなる＋パチパチ増
  if (ac) playThud();
  if (drawingOn()) {
    emitLog({ type: 'land', dx: d.dx });
  }
}

function step() {
  var now = performance.now();
  var dt = (now - lastStep) / 1000;
  lastStep = now;
  if (!started) return;
  if (dt > 7200) dt = 7200;
  var n = Math.min(600, Math.max(1, Math.ceil(dt)));
  var h = dt / n;
  for (var i = 0; i < n; i++) {
    fuel = Math.max(0, fuel - S.speed * (0.006 + 0.003 * fuel) * h);
    if (S.autoFeed && fuel + drops.length < 0.8 && (now - lastFeedAt) > 3000) {
      lastFeedAt = now;
      addLog();
    }
    var tg = flameTarget();
    var tau = tg > flame ? 2.5 : 1.5;
    flame += (tg - flame) * (1 - Math.exp(-h / tau));
    boost *= Math.exp(-h / 5);
  }
  for (var j = drops.length - 1; j >= 0; j--) {
    if (now >= drops[j].landAt || !drawingOn()) { var d = drops.splice(j, 1)[0]; land(d); }
  }
  updateFuelUI();
}

/* ---------- UI ---------- */
var dotsEl = document.getElementById('dots'), fuelTxt = document.getElementById('fuelTxt');
var dotEls = [];
for (var di = 0; di < MAX_FUEL; di++) { var it = document.createElement('i'); dotsEl.appendChild(it); dotEls.push(it); }
var lastFuelShown = -1;
function updateFuelUI() {
  var shown = Math.round(fuel * 10);
  if (shown === lastFuelShown) return;
  lastFuelShown = shown;
  for (var i = 0; i < MAX_FUEL; i++) {
    dotEls[i].style.opacity = (0.15 + 0.85 * Math.min(1, Math.max(0, fuel - i))).toFixed(2);
  }
  fuelTxt.textContent = fuel < 0.05 ? '熾火' : fuel.toFixed(1) + '本';
}

var slidersEl = document.getElementById('sliders');
SLIDERS.forEach(function (d) {
  var key = d[0], row = document.createElement('div');
  row.className = 'row';
  var lab = document.createElement('label'), sp = document.createElement('span'), out = document.createElement('output');
  if (key === 'master') sp.innerHTML = '<span class="ic">' + iconSvg('volume-2') + '</span>'; sp.appendChild(document.createTextNode(d[1])); lab.appendChild(sp); lab.appendChild(out);
  var inp = document.createElement('input');
  inp.type = 'range'; inp.min = d[2]; inp.max = d[3]; inp.step = d[4];
  inp.value = S[key]; out.textContent = d[5](S[key]);
  inp.addEventListener('input', function () {
    S[key] = parseFloat(inp.value); out.textContent = d[5](S[key]); save();
  });
  row.appendChild(lab); row.appendChild(inp); slidersEl.appendChild(row);
});
var autoEl = document.getElementById('autoFeed'), vidEl = document.getElementById('videoOff');
autoEl.checked = S.autoFeed; vidEl.checked = S.videoOff;
autoEl.addEventListener('change', function () { S.autoFeed = autoEl.checked; save(); });
vidEl.addEventListener('change', function () { S.videoOff = vidEl.checked; save(); applyVideoMode(); });

var segEl = document.getElementById('seasonSeg'), fxEl = document.getElementById('seasonFx');
SEASONS.forEach(function (sn) {
  var b = document.createElement('button');
  b.type = 'button'; b.innerHTML = '<span class="ic">' + iconSvg(SEAS_ICON[sn]) + '</span>' + SEAS_JA[sn]; b.dataset.s = sn;
  b.addEventListener('click', function () { S.season = sn; save(); refreshSeasonUI(); });
  segEl.appendChild(b);
});
fxEl.checked = S.seasonFx;
fxEl.addEventListener('change', function () { S.seasonFx = fxEl.checked; save(); });
var ffEl = document.getElementById('fireflies'), skyEl = document.getElementById('nightSky');
ffEl.addEventListener('change', function () { S.fireflies = ffEl.checked; S.firefliesManual = true; save(); });
skyEl.checked = S.nightSky;
skyEl.addEventListener('change', function () { S.nightSky = skyEl.checked; save(); });
var envRows = {};
ENV.forEach(function (e) {
  var row = document.createElement('div'); row.className = 'row';
  var head = document.createElement('div'); head.className = 'ehead';
  var chk = document.createElement('input'); chk.type = 'checkbox'; chk.checked = !!S['on_' + e.id];
  var nm = document.createElement('span'); nm.textContent = e.label;
  var out = document.createElement('output');
  head.appendChild(chk); head.appendChild(nm); head.appendChild(out);

    if (!c.next || c.next < t) c.next = t + c.init();
    var guard = 0;
    while (c.next < t + LOOK && guard++ < 200) c.next += Math.max(0.004, c.fn(c.next));
  }
}

function noiseBurst(t, decay, type, freq, q, peak, dest) {
  var src = ac.createBufferSource();
  src.buffer = whiteBuf;
  var f = ac.createBiquadFilter(); f.type = type; f.frequency.value = freq; f.Q.value = q;
  var gn = ac.createGain();
  gn.gain.setValueAtTime(peak, t);
  gn.gain.exponentialRampToValueAtTime(0.0001, t + decay);
  src.connect(f); f.connect(gn); gn.connect(dest || bus);
  src.start(t, Math.random() * 1.5, decay * 1.3 + 0.01);
  src.onended = function () { try { src.disconnect(); f.disconnect(); gn.disconnect(); } catch (e) {} };
}
function playCrackle(t, lv) {
  var mult = 0.25 + 1.75 * S.crackSize;
  var amp = (0.3 + 0.7 * Math.min(1, lv)) * mult;
  var f = 1500 * Math.pow(4, Math.random());        // 1.5k〜6kHz
  var peak = (0.12 + 0.55 * Math.pow(Math.random(), 2)) * amp * 2;
  noiseBurst(t, rnd(0.004, 0.03), 'bandpass', f, rnd(1.2, 3), peak);
  return peak / (amp * 2);
}
/* アクセントの「バチッ」: ときどき鳴る、はっきり目立つ一発。鋭い広帯域のアタック + ごく短い低い「ドン」、30%で小さな2発目 */
function accentGap(fl) {
  var f = Math.min(2, Math.max(0.15, (0.25 + 1.5 * S.crackFreq) * Math.min(1.2, fl)));   // 頻度の設定と炎の強さに比例
  return rnd(20, 90) * 0.73 / f;                                                          // 基準は平均およそ40秒
}
function accentHit(t, scale) {
  var mult = 0.25 + 1.75 * S.crackSize;
  var pk = 1.6 * mult * scale;    // 普段のパチの2〜3倍。最終段のコンプレッサーで抑える
  var src = ac.createBufferSource(); src.buffer = whiteBuf;
  var hp = ac.createBiquadFilter(); hp.type = 'highpass'; hp.frequency.value = 700; hp.Q.value = 0.7;
  var bp = ac.createBiquadFilter(); bp.type = 'peaking'; bp.frequency.value = rnd(1800, 4500); bp.Q.value = 0.8; bp.gain.value = 9;
  var gn = ac.createGain(), dec = rnd(0.02, 0.06);
  gn.gain.setValueAtTime(0.0001, t);
  gn.gain.linearRampToValueAtTime(pk, t + rnd(0.001, 0.003));
  gn.gain.exponentialRampToValueAtTime(0.0001, t + dec);
  src.connect(hp); hp.connect(bp); bp.connect(gn); gn.connect(bus);
  src.start(t, Math.random() * 1.5, dec + 0.02);
  src.onended = function () { try { src.disconnect(); hp.disconnect(); bp.disconnect(); gn.disconnect(); } catch (e) {} };
  var o = ac.createOscillator(), og = ac.createGain();
  o.type = 'sine'; o.frequency.setValueAtTime(rnd(80, 150), t);
  og.gain.setValueAtTime(0.0001, t);
  og.gain.linearRampToValueAtTime(0.5 * mult * scale, t + 0.002);
  og.gain.exponentialRampToValueAtTime(0.0001, t + 0.03);
  o.connect(og); og.connect(bus); o.start(t); o.stop(t + 0.04);
  o.onended = function () { try { o.disconnect(); og.disconnect(); } catch (e) {} };
}
function playAccent(t) {
  accentHit(t, 1);
  if (Math.random() < 0.3) accentHit(t + rnd(0.03, 0.08), 0.4);
}
function accentTick(t, fl) {
  if (S.crackFreq <= 0.001 || fl < 0.15) { nextAccent = 0; return; }   // 熾火・消えかけのときは鳴らさない
  if (!nextAccent) nextAccent = t + accentGap(fl);
  if (nextAccent < t - 2) nextAccent = t + accentGap(fl);              // 長く止まっていた後は取り戻さない
  if (nextAccent < t + LOOK) {
    var ta = Math.max(t + 0.01, nextAccent);
    playAccent(ta);
    queueVisual(ta, 24, true);
    nextAccent = ta + accentGap(fl);
  }
}
function playPop(t, lv) {
  var mult = 0.25 + 1.75 * S.crackSize;
  var amp = (0.4 + 0.6 * Math.min(1, lv)) * mult;
  noiseBurst(t, rnd(0.07, 0.13), 'bandpass', rnd(260, 700), 0.8, 1.1 * amp);
  noiseBurst(t, 0.02, 'bandpass', rnd(2500, 4500), 1, 0.5 * amp);
}
function playThud() {
  var t = ac.currentTime + 0.005;
  noiseBurst(t, 0.2, 'lowpass', 220, 0.7, 0.9);
  var o = ac.createOscillator(), gn = ac.createGain();
  o.type = 'sine';
  o.frequency.setValueAtTime(110, t); o.frequency.exponentialRampToValueAtTime(42, t + 0.14);
  gn.gain.setValueAtTime(0.5, t); gn.gain.exponentialRampToValueAtTime(0.0001, t + 0.18);
  o.connect(gn); gn.connect(bus); o.start(t); o.stop(t + 0.2);
  o.onended = function () { try { o.disconnect(); gn.disconnect(); } catch (e) {} };
}
function playClack() {
  noiseBurst(ac.currentTime + 0.005, 0.03, 'bandpass', 900, 1.5, 0.25);
}
function expSample(rate) { return -Math.log(1 - Math.random()) / rate; }

function crackleLevel(fl, em) { return Math.pow(Math.max(0, fl), 1.2) * (1 + 2.5 * boost) + 0.05 * em; }

function audioTick() {
  if (!ac || !audioReady) return;
  var t = ac.currentTime;
  var tt = performance.now() / 1000;
  var lfo = 0.5 * Math.sin(tt * 0.7) + 0.3 * Math.sin(tt * 1.9 + 1) + 0.2 * Math.sin(tt * 4.3 + 2);
  var lfo2 = Math.sin(tt * 0.37 + 0.5) * 0.6 + Math.sin(tt * 1.13) * 0.4;
  var em = emberLevel();
  var fl = started ? flame : 0;
  var vol = S.roar * S.roar;
  var lvl = 0.02 + 0.85 * Math.pow(Math.min(1.3, fl), 1.1) + 0.03 * em;

  master.gain.setTargetAtTime(started ? S.master * S.master : 0, t, 0.1);
  roarA.g.gain.setTargetAtTime(vol * lvl * (0.8 + 0.2 * lfo), t, 0.3);
  roarA.f.frequency.setTargetAtTime(380 + 420 * fl + 150 * lfo2, t, 0.3);
  roarB.g.gain.setTargetAtTime(vol * lvl * 0.6 * (0.85 + 0.15 * lfo2), t, 0.4);
  roarC.g.gain.setTargetAtTime(vol * (0.004 + 0.05 * fl) * (0.6 + 0.4 * Math.random()), t, 0.15);
  roarC.f.frequency.setTargetAtTime(2200 + 1200 * fl + 500 * lfo, t, 0.3);

  envTick(t);
  if (started && ac.state === 'running') schedEnv(t);
  if (!started || ac.state !== 'running') { nextCrackle = t + 0.1; nextAccent = 0; return; }
  accentTick(t, fl);
  if (nextCrackle < t) nextCrackle = t + 0.02;

  var guard = 0;
  while (nextCrackle < t + LOOK && guard++ < 60) {
    var rate = (0.2 + 7 * S.crackFreq) * crackleLevel(fl, em);
    if (rate < 0.02 || S.crackFreq <= 0.001) { nextCrackle = t + 0.5; break; }
    var t0 = nextCrackle;
    var isPop = Math.random() < (0.03 + 0.05 * S.crackFreq) * Math.min(1, fl + 0.2 * boost);
    if (isPop) {
      playPop(t0, fl);
      queueVisual(t0, 14);
    } else {
      var r = Math.random(), n = r < 0.5 ? 1 : r < 0.75 ? 2 : r < 0.9 ? 3 : 4;
      var tc = t0;
      for (var k = 0; k < n; k++) {
        var pk = playCrackle(tc, fl);
        queueVisual(tc, 1 + Math.round(3 * pk));
        tc += rnd(0.008, 0.045);
      }
    }
    nextCrackle = t0 + expSample(rate);
  }
  // 極低頻度からの復帰が遅れないよう、予約が遠すぎるときは（無記憶性を利用して）引き直す
  if (nextCrackle > t + 2.5) {
    var r2 = (0.2 + 7 * S.crackFreq) * crackleLevel(fl, em);
    nextCrackle = t + expSample(Math.max(0.05, r2));
  }
}
function queueVisual(t, count, accent) {
  if (!drawingOn()) return;
  if (visualQ.length >= 200) return;
  var ev = { t: t, n: count };
  if (accent) ev.accent = true;
  var k = visualQ.length;
  while (k > 0 && visualQ[k - 1].t > t) k--;      // 時刻順を保つ（アクセントは先の予約になるため）
  visualQ.splice(k, 0, ev);
}

document.addEventListener('visibilitychange', function () {
  visible = !document.hidden;
  if (visible) {
    visualQ.length = 0;
    if (ac && ac.state === 'suspended' && started) { try { ac.resume(); } catch (e) {} }
  } else {
    visualQ.length = 0;
  }
  emitActive();
});

/* ---------- 映像（scene3d.js）との窓口 ---------- */
var logCbs = [], crackleCbs = [], activeCbs = [];
function subscribe(list, cb) {
  list.push(cb);
  return function () { var i = list.indexOf(cb); if (i >= 0) list.splice(i, 1); };
}
function emitTo(list, ev) {
  for (var i = 0; i < list.length; i++) { try { list[i](ev); } catch (e) { console.error(e); } }
}
function emitLog(ev) { if (logCbs.length) emitTo(logCbs, ev); }
function emitActive() { if (activeCbs.length) emitTo(activeCbs, drawingOn()); }
// 音の予約時刻に達した火の粉イベントを取り出して onCrackle の購読者へ渡す
function pumpCrackle() {
  if (!crackleCbs.length || !ac) return;
  var ct = ac.currentTime;
  while (visualQ.length && visualQ[0].t <= ct) {
    var ev = visualQ.shift();
    var out = { n: ev.n > 8 ? ev.n : ev.n + 1, t: ev.t };
    if (ev.accent) out.accent = true;
    emitTo(crackleCbs, out);
  }
  if (visualQ.length > 150) visualQ.length = 0;
}
window.TAKIBI = {
  version: 1,
  maxFuel: MAX_FUEL,
  getState: function () {
    return {
      started: started,
      flame: started ? flame : 0,     // なめらかな炎の強さ 0..~1.3
      fuel: fuel,                     // 薪の量（1本 = 1.0）
      maxFuel: MAX_FUEL,
      ember: emberLevel(),            // 熾火の強さ 0..1（燃料が尽きると1）
      boost: boost,                   // くべた直後のパチパチ増 1→0
      season: S.season,               // 'spring' | 'summer' | 'autumn' | 'winter'
      scene: S.scene,                 // シーンの id（scenes/*.js）
      nightSky: S.nightSky,           // 夜空（星・月・流れ星）
      fireflies: firefliesOn(),       // ホタル（季節の初期値か、手で変えた値）
      seasonFx: S.seasonFx,
      brightness: S.brightness,       // 0.3..1.6
      videoOff: S.videoOff,
      grass: grassLevel(),            // 草の量: 'many' | 'normal' | 'few' | 'none'（自動軽量化を反映した実効値）
      active: drawingOn()             // 描画すべきか（タブ表示中かつ映像オンのとき true）
    };
  },
  addLog: addLog,
  applySceneAudio: applySceneAudio,   // シーンが切り替わったとき、audio 指定（autoOn / reverb）を渡す
  reportSlow: reportSlow,             // 3D側が「5秒平均が20fps未満」を検知したときに呼ぶ
  pump: pumpCrackle,                  // 3D側が毎フレーム呼んでもよい（onCrackle の遅延を減らす）
  onLogAdded: function (cb) { return subscribe(logCbs, cb); },       // {type:'drop',t0,landAt,dx,ang} / {type:'land',dx}（performance.now基準ms）
  onCrackle: function (cb) { return subscribe(crackleCbs, cb); },   // {n, t, accent?} 音の予約時刻に同期した火の粉（n=個数）。accent:true は目立つ「バチッ」（n=24）
  onActiveChange: function (cb) { return subscribe(activeCbs, cb); } // (active:boolean)
};

/* シーンの音の連動: audio.autoOn の環境音を自動でオンにし、シーンを離れたら自動でオンにした分だけ戻す。audio.reverb があれば残響をかける */
function applySceneAudio(a) {
  a = a || {};
  autoApplied.forEach(function (id) { S['on_' + id] = false; if (envRows[id]) envRows[id].chk.checked = false; });
  autoApplied = [];
  (a.autoOn || []).forEach(function (id) {
    if (!envRows[id] || S['on_' + id]) return;
    S['on_' + id] = true; autoApplied.push(id); envRows[id].chk.checked = true;
  });
  curReverb = a.reverb || null;
  applyReverb();
  refreshSeasonUI();
}

/* ---------- 草の量と自動軽量化 ---------- */
// 手動の選択は S.grass（次回以降も尊重）。自動で下げた分は S.grassAuto に残し、実効値は重いほう
function grassLevel() {
  var a = GRASS.indexOf(S.grass), b = S.grassAuto ? GRASS.indexOf(S.grassAuto) : -1;
  return GRASS[Math.max(a, b)];
}
var autoDrops = 0, toastEl = document.getElementById('toast'), toastTimer = 0;
function showToast(msg) {
  toastEl.textContent = msg; toastEl.classList.add('on');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(function () { toastEl.classList.remove('on'); }, 4500);
}
function reportSlow() {
  var i = GRASS.indexOf(grassLevel());
  if (autoDrops >= 2 || i >= GRASS.length - 1) return;   // 自動で下げるのは1セッション2段階まで
  autoDrops++;
  S.grassAuto = GRASS[i + 1]; save(); refreshGrassUI();
  showToast('重いため草を減らしました');
}
var grassSegEl = document.getElementById('grassSeg');
GRASS.forEach(function (g) {
  var b = document.createElement('button');
  b.type = 'button'; b.dataset.g = g; b.textContent = GRASS_JA[g];
  b.addEventListener('click', function () { S.grass = g; S.grassAuto = ''; save(); refreshGrassUI(); });
  grassSegEl.appendChild(b);
});
function refreshGrassUI() {
  var cur = grassLevel();
  Array.prototype.forEach.call(grassSegEl.children, function (b) { b.classList.toggle('on', b.dataset.g === cur); b.disabled = !videoOK; });
  document.getElementById('grassRow').classList.toggle('off', !videoOK);
}

/* ---------- 映像の起動（3D のみ） ---------- */
var WEBGL_OK = (function () {
  try {
    var c = document.createElement('canvas');
    var gl = c.getContext('webgl2') || c.getContext('webgl');
    if (!gl) return false;
    var x = gl.getExtension('WEBGL_lose_context'); if (x) x.loseContext();
    return true;
  } catch (e) { return false; }
})();
var cv3 = null;
function showNoVideo() {
  videoOK = false;
  if (cv3) { cv3.remove(); cv3 = null; }
  document.body.classList.add('no-webgl');
  refreshGrassUI(); emitActive();
}
function boot3d() {
  if (!WEBGL_OK) { showNoVideo(); return; }
  import('./scene3d.js').then(function (m) {
    cv3 = document.createElement('canvas'); cv3.id = 'cv3';
    document.body.insertBefore(cv3, document.body.firstChild);
    videoOK = true;
    var list = m.SCENES || [];
    if (!list.some(function (s) { return s.id === S.scene; }) && list.length) S.scene = list[0].id;
    var sel = document.getElementById('sceneSel');
    list.forEach(function (s) {
      var o = document.createElement('option'); o.value = s.id; o.textContent = s.label; sel.appendChild(o);
    });
    sel.value = S.scene;
    sel.addEventListener('change', function () { S.scene = sel.value; save(); });
    document.getElementById('sceneRow').style.display = '';
    refreshGrassUI();
    return m.start({ canvas: cv3, api: window.TAKIBI });
  }).catch(function (e) {
    console.error('映像を開始できませんでした。', e);
    showNoVideo();
  });
}

/* ---------- 起動 ---------- */
document.getElementById('ignite').addEventListener('click', function () {
  if (started) return;
  try { initAudio(); if (ac && ac.state === 'suspended') ac.resume(); } catch (e) { console.error(e); ac = null; audioReady = false; }
  started = true;
  document.body.classList.add('started');
  fuel = 2.5; flame = 0; boost = 0.6;
  lastStep = performance.now();
  updateFuelUI();
  wakeUI();
});

document.body.classList.toggle('video-off', S.videoOff);
updateFuelUI();
refreshGrassUI();
boot3d();
// rAFに依存しないタイマー: シミュレーション更新と音の先読みスケジュール
setInterval(function () { step(); audioTick(); pumpCrackle(); }, 50);

})();
</script>
</body>
